<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script>
      // Callback appelée par Google Maps API
      function initMap() {
        if (window.initMapLoaded) return;
        window.initMapLoaded = true;

        // Événement personnalisé pour informer React que l’API est prête
        window.dispatchEvent(new Event('google-maps-loaded'));
      }
    </script>

    <script
      async
      defer
      src="https://maps.googleapis.com/maps/api/js?key=VOTRE_CLE_API&callback=initMap"
    ></script>
    
  </body>
</html>
